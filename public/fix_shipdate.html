const DB_ID = '7cf548d1d20245e0a4c3547040c7524d';

function log(msg, cls='info') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function queryPO(poNum, color) {
  const res = await fetch('/api/notion.js', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      dbId: DB_ID,
      filter: {
        and: [
          {property: 'PO번호', title: {equals: poNum}},
          {property: '색상', rich_text: {equals: color}}
        ]
      }
    })
  });
  const data = await res.json();
  return data.results || [];
}

async function updatePage(pageId, newDate) {
  const res = await fetch('/api/notion.js', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      action: 'update',
      pageId,
      properties: {
        'date:Ship Date:is_datetime': 0,
        'date:Ship Date:start': newDate
      }
    })
  });
  return res.json();
}

async function run() {
  document.getElementById('btn').disabled = true;
  log('수정 시작...', 'info');
  let success = 0, fail = 0;

  for (const item of FIXES) {
    try {
      const pages = await queryPO(item.po, item.color);
      if (pages.length === 0) {
        log(`❌ ${item.po} | ${item.color} — 찾을 수 없음`, 'err');
        fail++; continue;
      }
      for (const page of pages) {
        await updatePage(page.id, item.correct);
      }
      log(`✓ ${item.po} | ${item.color} | ${item.current} → ${item.correct}`, 'ok');
      success++;
    } catch(e) {
      log(`❌ ${item.po} — ${e.message}`, 'err');
      fail++;
    }
    await new Promise(r => setTimeout(r, 300));
  }

  log(`완료! 성공: ${success}, 실패: ${fail}`, 'info');
  document.getElementById('btn').disabled = false;
}
</script>
